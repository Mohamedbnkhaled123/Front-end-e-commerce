<div class="bg-gray-100 min-h-screen py-12">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white border border-gray-200 rounded-md shadow-sm overflow-hidden">
      <div class="bg-slate-900 text-white py-12 px-8 border-b-4 border-amber-500">
        <h1 class="text-3xl font-black tracking-tight">Privacy, Returns &amp; Policies</h1>
        <p class="text-sm text-slate-400 mt-2">Effective date: January 2026</p>
      </div>
      <div class="p-8 space-y-6 text-slate-600 text-sm leading-relaxed">
        <div>
          @if (content) {
            <p class="text-slate-600 whitespace-pre-line leading-relaxed">{{ content }}</p>
          } @else {
            <p class="text-slate-400 italic">Policy content will be managed through the Admin CMS panel. Once published by the administrator, the terms and conditions text will appear here.</p>
          }
        </div>
      </div>
    </div>
  </div>
</div>
