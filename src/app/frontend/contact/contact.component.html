<div class="bg-gray-100 min-h-screen py-12">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Info Card -->
      <div class="bg-slate-900 text-white rounded-md shadow-sm p-8 border-l-4 border-amber-500 flex flex-col justify-between">
        <div>
          <h1 class="text-3xl font-black tracking-tight">Contact Us</h1>
          <p class="text-sm text-slate-400 mt-2">We are happy to help. Reach out via email or phone.</p>
          @if (content) {
            <p class="text-xs text-slate-300 mt-4 border-t border-slate-800 pt-4 whitespace-pre-line leading-relaxed">{{ content }}</p>
          }
        </div>
        <div class="space-y-4 mt-8 text-sm text-slate-300">
          <div class="flex items-center gap-3">
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <span>support&#64;velorastore.com</span>
          </div>
          <div class="flex items-center gap-3">
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            <span>+20 100 000 0000</span>
          </div>
          <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-amber-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span>Cairo, Egypt<br>Nasr City District</span>
          </div>
        </div>
      </div>
      <!-- Contact Form -->
      <div class="bg-white border border-gray-200 rounded-md shadow-sm p-8">
        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider border-b border-gray-100 pb-3 mb-4">Send a Message</h2>
        <form class="space-y-4">
          <div>
            <label for="contactName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
            <input type="text" id="contactName" placeholder="John Doe" class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none shadow-sm">
          </div>
          <div>
            <label for="contactEmail" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
            <input type="email" id="contactEmail" placeholder="your@email.com" class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none shadow-sm">
          </div>
          <div>
            <label for="contactSubject" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Subject</label>
            <input type="text" id="contactSubject" placeholder="Order enquiry, product info, etc." class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none shadow-sm">
          </div>
          <div>
            <label for="contactMsg" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Message</label>
            <textarea rows="4" id="contactMsg" placeholder="Tell us how we can help you..." class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none shadow-sm"></textarea>
          </div>
          <button type="submit" class="w-full bg-[#FF9900] hover:bg-[#DF8300] text-white border border-[#E68A00] rounded-lg py-2.5 text-sm font-bold shadow-sm transition-all">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</div>
