<div class="min-h-screen bg-slate-950 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 text-white relative overflow-hidden">
  <!-- Background Glow Effects -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full space-y-8 bg-slate-900/90 border border-blue-900/40 p-8 rounded-2xl shadow-2xl backdrop-blur-xl relative z-10">
    <!-- Header -->
    <div class="text-center">
      <div class="flex items-center justify-center mb-6">
        <app-logo customLink="/dashboard-login" [isAdmin]="true"></app-logo>
      </div>
      <h2 class="text-2xl font-extrabold tracking-tight text-white flex items-center justify-center gap-2">
        <span class="italic transform -skew-x-6 inline-flex items-baseline font-sans font-normal text-white" dir="ltr">
          sho<span class="font-black text-blue-400 tracking-tight">PRO</span>
        </span>
        <span class="text-xs font-bold bg-amber-400 text-slate-950 px-2 py-0.5 rounded shadow-2xs">SUPER ADMIN</span>
      </h2>
      <p class="mt-1 text-xs text-slate-400 font-medium">
        First-Time System Ownership Claim
      </p>
    </div>

    <!-- Alert Messages -->
    @if (errorMsg) {
      <div class="bg-rose-500/10 border border-rose-500/30 rounded-xl p-3 text-xs text-rose-300 flex items-start gap-2">
        <svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMsg }}</span>
      </div>
    }

    @if (successMsg) {
      <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3 text-xs text-emerald-300 flex items-start gap-2">
        <svg class="w-4 h-4 text-emerald-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span>{{ successMsg }}</span>
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onClaimSuperAdmin()" class="mt-6 space-y-4">
      <div>
        <label for="setupKey" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">
          System Setup Key
        </label>
        <input 
          id="setupKey" 
          name="setupKey" 
          type="password" 
          [(ngModel)]="setupKey" 
          placeholder="Enter SUPERADMIN_SETUP_KEY from .env"
          required
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors font-mono"
        />
      </div>

      <div>
        <label for="name" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">
          Super Admin Name
        </label>
        <input 
          id="name" 
          name="name" 
          type="text" 
          [(ngModel)]="name" 
          placeholder="e.g. Master Administrator"
          required
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
        />
      </div>

      <div>
        <label for="email" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">
          Private Email Address
        </label>
        <input 
          id="email" 
          name="email" 
          type="email" 
          [(ngModel)]="email" 
          placeholder="superadmin@shopro.com"
          required
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
        />
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">
          Private Password
        </label>
        <input 
          id="password" 
          name="password" 
          type="password" 
          [(ngModel)]="password" 
          placeholder="••••••••"
          required
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
        />
      </div>

      <div>
        <label for="confirmPassword" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">
          Confirm Password
        </label>
        <input 
          id="confirmPassword" 
          name="confirmPassword" 
          type="password" 
          [(ngModel)]="confirmPassword" 
          placeholder="••••••••"
          required
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="isLoading"
        class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white text-xs font-medium py-3 px-4 rounded-xl shadow-lg shadow-blue-600/20 transition-all cursor-pointer disabled:opacity-50 mt-2 flex items-center justify-center gap-2 min-h-[44px]">
        @if (isLoading) {
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Claiming System Ownership...</span>
        } @else {
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
          </svg>
          <span>Initialize &amp; Claim Super Admin</span>
        }
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-800">
      <a routerLink="/dashboard-login" class="text-xs text-slate-400 hover:text-white transition-colors">
        ← Standard Dashboard Login
      </a>
    </div>
  </div>
</div>
