<div class="bg-slate-50 min-h-screen py-8">
  <div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-4">
      <a routerLink="/admin/listusers" class="text-xs text-slate-500 hover:text-orange-600 font-semibold flex items-center gap-1.5 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        Back to Admin List
      </a>
    </div>
    <div class="bg-white border border-gray-200 rounded-md p-8 shadow-sm">
      <h1 class="text-xl font-extrabold text-slate-900 border-b border-gray-100 pb-3 mb-6">Create System Admin</h1>
      
      <!-- Alerts -->
      <div *ngIf="errorMsg" class="mb-4 bg-red-50 border border-red-200 text-red-700 text-xs font-medium px-3 py-2 rounded-md">
        {{ errorMsg }}
      </div>
      <div *ngIf="successMsg" class="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-medium px-3 py-2 rounded-md">
        {{ successMsg }}
      </div>

      <form (ngSubmit)="onCreateAdmin()" class="space-y-4">
        <div>
          <label for="fullName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
          <input type="text" id="fullName" name="fullName" [(ngModel)]="name" placeholder="Enter full name" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none shadow-sm">
        </div>
        <div>
          <label for="emailAddress" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
          <input type="email" id="emailAddress" name="emailAddress" [(ngModel)]="email" placeholder="name@example.com" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none shadow-sm">
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="pwd" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
            <input type="password" id="pwd" name="pwd" [(ngModel)]="password" placeholder="Enter password" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none shadow-sm">
          </div>
          <div>
            <label for="confirmPwd" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Confirm Password</label>
            <input type="password" id="confirmPwd" name="confirmPwd" [(ngModel)]="confirmPassword" placeholder="Re-enter password" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none shadow-sm">
          </div>
        </div>
        
        <div class="mt-8 pt-4 border-t border-gray-100 flex justify-end gap-3">
          <a routerLink="/admin/listusers" class="bg-white hover:bg-gray-50 text-slate-700 border border-gray-300 rounded-lg px-6 py-2.5 text-sm font-semibold shadow-sm transition-all">Cancel</a>
          <button type="submit" [disabled]="isLoading" class="bg-[#FF9900] hover:bg-[#DF8300] text-white border border-[#E68A00] rounded-lg px-6 py-2.5 text-sm font-bold shadow-sm transition-all disabled:opacity-50">
            {{ isLoading ? 'Saving...' : 'Create Admin' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
