<header class="bg-slate-900 text-white h-14 flex items-center justify-between px-6 shadow-md border-b border-slate-800">
  <div class="flex items-center gap-6">
    <!-- Brand Title -->
    <div class="flex items-center space-x-2 border-r border-slate-700 pr-6">
      <span class="text-lg font-extrabold tracking-wider text-white">
        VELORA <span class="text-amber-500 font-medium">ADMIN</span>
      </span>
    </div>
    
    <!-- Admin Navigation Links -->
    <nav class="hidden md:flex items-center space-x-6">
      <a routerLink="/admin/home" 
         routerLinkActive="text-amber-400 font-bold border-b-2 border-amber-400 py-4 mt-0.5" 
         [routerLinkActiveOptions]="{ exact: true }"
         class="text-sm font-medium text-slate-300 hover:text-white transition-colors duration-150 py-4">
        Dashboard
      </a>
      <a routerLink="/admin/orders" 
         routerLinkActive="text-amber-400 font-bold border-b-2 border-amber-400 py-4 mt-0.5" 
         class="text-sm font-medium text-slate-300 hover:text-white transition-colors duration-150 py-4">
        Orders
      </a>
      <a routerLink="/admin/products" 
         routerLinkActive="text-amber-400 font-bold border-b-2 border-amber-400 py-4 mt-0.5" 
         class="text-sm font-medium text-slate-300 hover:text-white transition-colors duration-150 py-4">
        Products
      </a>
      <a routerLink="/admin/cms" 
         routerLinkActive="text-amber-400 font-bold border-b-2 border-amber-400 py-4 mt-0.5" 
         class="text-sm font-medium text-slate-300 hover:text-white transition-colors duration-150 py-4">
        CMS Pages
      </a>
      <a routerLink="/admin/reviews" 
         routerLinkActive="text-amber-400 font-bold border-b-2 border-amber-400 py-4 mt-0.5" 
         class="text-sm font-medium text-slate-300 hover:text-white transition-colors duration-150 py-4">
        Reviews
      </a>
      <a routerLink="/admin/listusers" 
         routerLinkActive="text-amber-400 font-bold border-b-2 border-amber-400 py-4 mt-0.5" 
         class="text-sm font-medium text-slate-300 hover:text-white transition-colors duration-150 py-4">
        Admins
      </a>
    </nav>
  </div>

  <div class="flex items-center space-x-4">
    <!-- Status / User Action -->
    <div class="hidden sm:flex flex-col text-right">
      <span class="text-xs text-slate-400">Security Clearance</span>
      <span class="text-xs font-bold text-emerald-400">System Admin</span>
    </div>

    <span class="h-6 w-px bg-slate-700"></span>

    <!-- Actions -->
    <a routerLink="/home" 
       class="text-xs font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-600 px-3.5 py-1.5 rounded transition-all focus:outline-none">
      Storefront
    </a>

    <button (click)="logout()" 
            class="text-xs font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-600 px-3.5 py-1.5 rounded transition-all focus:outline-none">
      Logout
    </button>
  </div>
</header>
