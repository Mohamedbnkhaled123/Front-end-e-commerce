<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="pointer-events-auto p-4 rounded-xl shadow-2xl border flex items-center justify-between gap-3 text-xs font-bold transition-all transform translate-y-0 duration-300 animate-slide-up"
      [ngClass]="{
        'bg-emerald-600 text-white border-emerald-700 shadow-emerald-900/20': toast.type === 'success',
        'bg-rose-600 text-white border-rose-700 shadow-rose-900/20': toast.type === 'error',
        'bg-amber-600 text-white border-amber-700 shadow-amber-900/20': toast.type === 'info'
      }">
      <div class="flex items-center gap-2.5">
        @if (toast.type === 'success') {
          <svg class="w-5 h-5 text-white shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        }
        @if (toast.type === 'error') {
          <svg class="w-4 h-4 text-white shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        }
        @if (toast.type === 'info') {
          <svg class="w-4 h-4 text-white shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        }
        <span class="text-white">{{ toast.message }}</span>
      </div>
      <button (click)="toastService.remove(toast.id)" class="text-white/70 hover:text-white font-medium text-sm p-1 cursor-pointer">&times;</button>
    </div>
  }
</div>
